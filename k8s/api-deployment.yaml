apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: course
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/elvenhope/turiba-devops-labs/api:a9546981f7d1077fa313d4c66777e880c832eca9
          ports:
            - containerPort: 5000
